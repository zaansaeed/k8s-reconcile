apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-bad-image
---
apiVersion: apps/v1
kind: Deployment #actual deployment starts here
metadata:
  name: web
  namespace: k8s-reconcile-bad-image
spec: #whats in the deployement
  replicas: 1 #num pods
  selector:
    matchLabels:
      app: web #pods must match this label
  template: #each pod has this template
    metadata:
      labels:
        app: web #must match the label above
    spec:
      containers: #actual mod contents
        - name: web
          image: nginx:1.27-does-not-exist
          ports:
            - containerPort: 80
