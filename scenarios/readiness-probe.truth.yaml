namespace: k8s-reconcile-readiness
tier: 2
faults:
  - object: deployment/frontend
    field: spec.template.spec.containers[frontend].readinessProbe.httpGet.port
    current: "8080"
    fix: change the readiness probe's port to 80, where nginx listens
    repairable: true
    evidence: get_deployments shows port 80/TCP and a readiness probe on 8080; get_events shows "connection refused" on 8080
    partial:
      - removes the readiness probe, which makes the pod ready but drops the health check
    wrong:
      - changes containerPort to 8080; it is informational and nginx still listens on 80
      - blames the application or the image
expect_after_repair:
  deployment/frontend: healthy
