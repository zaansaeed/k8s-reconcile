apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-http-port
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: k8s-reconcile-http-port
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: k8s-reconcile-http-port
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www && echo ok > /www/index.html
              exec httpd -f -p 8081 -h /www
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: k8s-reconcile-http-port
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          env:
            - name: BACKEND_URL
              value: http://backend/
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if wget -q -T 2 -O /dev/null "$BACKEND_URL"; then
                  echo "backend ok"
                else
                  echo "ERROR: backend unavailable at $BACKEND_URL"
                fi
                sleep 5
              done
          readinessProbe:
            exec:
              command: ["sh", "-c", "wget -q -T 2 -O /dev/null \"$BACKEND_URL\""]
            periodSeconds: 5
            timeoutSeconds: 3
