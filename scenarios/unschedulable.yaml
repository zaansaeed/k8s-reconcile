apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-unschedulable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: k8s-reconcile-unschedulable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "exec sleep 3600"]
          resources:
            requests:
              memory: 64Gi
              cpu: 100m
            limits:
              memory: 64Gi
