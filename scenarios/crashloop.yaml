apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-crashloop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k8s-reconcile-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set" >&2
                exit 1
              fi
              exec sleep 3600
