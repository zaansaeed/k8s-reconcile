namespace: k8s-reconcile-liveness
tier: 3
faults:
  - object: deployment/shop
    field: spec.template.spec.containers[shop].livenessProbe.httpGet.path
    current: /healthz
    fix: change the liveness probe's path to /, which nginx serves
    repairable: true
    evidence: get_events shows "Liveness probe failed ... 404" and "failed liveness probe, will be restarted"; get_pods shows the last exit was Completed (exit 0), so the kubelet killed a healthy container
    partial:
      - removes the liveness probe, which stops the restarts but drops the health check
      - adds a /healthz location to the nginx config, which is valid but needs a config change no tool can make
    wrong:
      - says the application is crashing
      - loosens the probe's timing or threshold; a 404 fails at any threshold
expect_after_repair:
  deployment/shop: healthy
