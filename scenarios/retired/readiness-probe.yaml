apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-readiness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: k8s-reconcile-readiness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
