namespace: k8s-reconcile-noisy
tier: 4
faults:
  - object: deployment/catalog
    field: spec.template.spec.containers[catalog].readinessProbe.httpGet.path
    current: /healthz
    fix: change the readiness probe's path to /, which nginx serves
    repairable: true
    evidence: 'get_pods shows catalog Running 0/1; get_events shows "Readiness probe failed: HTTP probe failed with statuscode: 404"; get_deployments shows the probe on /healthz with image nginx:1.27'
    partial:
      - removes the readiness probe
    wrong:
      - changes the probe's port; 80 is correct
not_faults:
  - object: deployment/jobs
    note: restarts=1 is a deliberate one-time exit on first boot; it then runs normally and must not be changed
  - object: deployment/ingest
    note: its logs print ERROR lines by design but it is Running 1/1; it must not be changed
  - object: deployment/frontend
    note: its early "connection refused" readiness event is a startup blip; it is healthy
expect_after_repair:
  deployment/catalog: healthy
  deployment/jobs: untouched
  deployment/ingest: untouched
  deployment/frontend: untouched
  deployment/api: untouched
  deployment/auth: untouched
  deployment/cache: untouched
  deployment/metrics: untouched
