apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-slow-start
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-reconcile-slow-start
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "starting: warming cache"
              sleep 15
              mkdir -p /www && echo ok > /www/index.html
              echo "listening on :80"
              exec httpd -f -p 80 -h /www
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 1
