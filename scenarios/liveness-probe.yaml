apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-liveness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: k8s-reconcile-liveness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: nginx:1.27
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
