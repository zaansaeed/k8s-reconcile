apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-chain
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: k8s-reconcile-chain
spec:
  selector:
    app: db
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: k8s-reconcile-chain
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: k8s-reconcile-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: redis:7.4
          args: ["--bind", "127.0.0.1"]
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k8s-reconcile-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "6379"
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www && echo ok > /www/index.html
              httpd -p 8080 -h /www
              while true; do
                if nc -z -w 2 "$DB_HOST" "$DB_PORT"; then
                  echo "db ok"
                else
                  echo "ERROR: cannot reach db at $DB_HOST:$DB_PORT"
                fi
                sleep 5
              done
          ports:
            - containerPort: 8080
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -z -w 2 \"$DB_HOST\" \"$DB_PORT\""]
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-reconcile-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          env:
            - name: API_URL
              value: http://api:8080/
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if wget -q -T 2 -O /dev/null "$API_URL"; then
                  echo "api ok"
                else
                  echo "ERROR: api unavailable at $API_URL"
                fi
                sleep 5
              done
          readinessProbe:
            exec:
              command: ["sh", "-c", "wget -q -T 2 -O /dev/null \"$API_URL\""]
            periodSeconds: 5
            timeoutSeconds: 3
