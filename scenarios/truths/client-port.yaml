namespace: k8s-reconcile-client-port
tier: 4
faults:
  - object: deployment/api
    field: spec.template.spec.containers[api].env
    current: CACHE_PORT=6380, while redis listens on its default 6379 and the cache container declares 6379
    fix: set api's CACHE_PORT to 6379
    repairable: true
    evidence: 'get_logs on api shows "ERROR: cannot reach cache at cache:6380"; get_logs on cache shows "Running mode=standalone, port=6379"; get_deployments shows cache with no args and port 6379/TCP'
    partial:
      - names the port mismatch but fixes it on the cache side
    wrong:
      - changes cache to listen on 6380; the cache Service only exposes 6379, so api stays unready
      - reports cache as broken
      - removes or loosens api's readiness probe
not_faults:
  - object: deployment/cache
    note: healthy and correctly configured; it must not be changed
expect_after_repair:
  deployment/api: healthy
  deployment/cache: untouched
