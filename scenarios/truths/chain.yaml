namespace: k8s-reconcile-chain
tier: 4
faults:
  - object: deployment/db
    field: spec.template.spec.containers[db].args
    current: '["--bind", "127.0.0.1"], so redis only accepts connections from inside its own pod'
    fix: make redis listen on all interfaces, by removing the args or changing them to --bind 0.0.0.0
    repairable: true
    evidence: 'get_logs on web shows "ERROR: api unavailable at http://api:8080/"; get_logs on api shows "ERROR: cannot reach db at db:6379"; get_deployments shows db with args --bind 127.0.0.1 while api connects to db:6379'
    partial:
      - traces the failure to db but blames its port or image instead of the bind address
      - stops at api and reports db as unreachable without finding why
    wrong:
      - removes or loosens api's or web's readiness probe; the pods turn 1/1 but api still cannot reach db
      - changes api's DB_HOST or DB_PORT, or web's API_URL
      - reports web or api as the root cause
not_faults:
  - object: deployment/api
    note: unready only because db refuses connections; its spec is correct
  - object: deployment/web
    note: unready only because api has no ready endpoints; its spec is correct
expect_after_repair:
  deployment/db: healthy
  deployment/api: healthy
  deployment/web: healthy
