namespace: k8s-reconcile-slow-start
tier: 4
settle: 80s
faults:
  - object: deployment/web
    field: spec.template.spec.containers[web].livenessProbe
    current: initialDelaySeconds 2, periodSeconds 3, failureThreshold 1, while the app sleeps 15s before listening
    fix: give the app time to start, by raising initialDelaySeconds above 15s, adding a startupProbe, or raising failureThreshold so the probe tolerates the 15s startup
    repairable: true
    evidence: 'get_deployments shows "sleep 15" before httpd starts and a liveness probe that fails after 2s; get_events shows "connection refused" on port 80 then "failed liveness probe, will be restarted"; get_logs shows "starting: warming cache" and never "listening on :80"'
    partial:
      - identifies the probe as killing the app but gives no working timing
    wrong:
      - changes the probe's port or path; port 80 and path / are correct once the app is up
      - changes containerPort or the app's command
      - removes the liveness probe
expect_after_repair:
  deployment/web: healthy
