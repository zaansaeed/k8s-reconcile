namespace: k8s-reconcile-service-name
tier: 4
faults:
  - object: deployment/api
    field: spec.template.spec.containers[api].env
    current: CACHE_HOST=redis, the name of the Deployment, which has no Service and does not resolve
    fix: set api's CACHE_HOST to cache, the name worker uses successfully
    repairable: true
    evidence: 'get_logs on api shows "ERROR: cannot reach cache at redis:6379"; get_events shows "nc: bad address ''redis''"; get_deployments shows worker, which is healthy, using CACHE_HOST=cache against the same port'
    partial:
      - identifies the unresolvable host but does not choose cache
    wrong:
      - sets CACHE_HOST to another form of redis, such as a fully qualified name, or to localhost or an IP
      - changes the redis or worker deployment
      - removes or loosens api's readiness probe
not_faults:
  - object: deployment/redis
    note: healthy; the Service in front of it is named cache
  - object: deployment/worker
    note: healthy; it shows the working host name
expect_after_repair:
  deployment/api: healthy
  deployment/redis: untouched
  deployment/worker: untouched
