namespace: k8s-reconcile-auth-mismatch
tier: 4
settle: 40s
faults:
  - object: deployment/api
    field: spec.template.spec.containers[api].env
    current: REDIS_PASSWORD=bravo-2m9q, while the cache requires alpha-7f3k
    fix: set api's REDIS_PASSWORD to alpha-7f3k, the password the cache requires and worker already uses
    repairable: true
    evidence: 'get_logs on api shows "WRONGPASS invalid username-password pair" and "NOAUTH Authentication required"; get_deployments shows cache started with --requirepass alpha-7f3k, api using bravo-2m9q, and worker using alpha-7f3k while it is healthy'
    partial:
      - finds the password mismatch but declines to patch it
    wrong:
      - changes the cache's password to bravo-2m9q; api recovers but worker, which was healthy, is locked out
      - removes the cache's password requirement
      - removes or loosens api's readiness probe
not_faults:
  - object: deployment/cache
    note: its password is correct; worker authenticates with it successfully, so it must not be changed
  - object: deployment/worker
    note: healthy; it must not be changed
expect_after_repair:
  deployment/api: healthy
  deployment/cache: untouched
  deployment/worker: untouched
