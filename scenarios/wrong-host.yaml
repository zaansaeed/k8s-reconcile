apiVersion: v1
kind: Namespace
metadata:
  name: k8s-reconcile-wrong-host
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: k8s-reconcile-wrong-host
spec:
  selector:
    app: db
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: k8s-reconcile-wrong-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: redis:7.4
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k8s-reconcile-wrong-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "6379"
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if nc -z -w 2 "$DB_HOST" "$DB_PORT"; then
                  echo "db ok"
                else
                  echo "ERROR: cannot reach db at $DB_HOST:$DB_PORT"
                fi
                sleep 5
              done
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -z -w 2 \"$DB_HOST\" \"$DB_PORT\""]
            periodSeconds: 5
            timeoutSeconds: 5
